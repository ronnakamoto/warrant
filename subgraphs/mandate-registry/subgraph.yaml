specVersion: 1.2.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: MandateRegistry
    network: base-sepolia
    source:
      address: "0x8704606Bde5E257dC009cCe55214Df70975f89c5"
      abi: MandateRegistry
      startBlock: 46661760
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Registry
        - Binding
        - ForestLeaf
        - MandateHop
        - RevokeEvent
      abis:
        - name: MandateRegistry
          file: ./abis/MandateRegistry.json
      eventHandlers:
        - event: Bound(indexed address,uint256,uint256,uint8)
          handler: handleBound
        - event: Revoked(indexed address,uint256,uint256,uint256,uint32)
          handler: handleRevoked
        - event: MandateInserted(indexed address,uint256,uint256,uint256)
          handler: handleMandateInserted
        - event: MandateRevoked(indexed address,uint256,uint256)
          handler: handleMandateRevoked
      file: ./src/mandate-registry.ts
