specVersion: 1.2.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: MandateRegistry
    network: base-sepolia
    source:
      address: "0x103749E5529c3Ce31A1EB8e0657280AaE7e9dA89"
      abi: MandateRegistry
      startBlock: 46413332
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Registry
        - Binding
        - RevokeEvent
      abis:
        - name: MandateRegistry
          file: ./abis/MandateRegistry.json
      eventHandlers:
        - event: Bound(indexed address,uint256,uint256,uint8)
          handler: handleBound
        - event: Revoked(indexed address,uint256,uint256,uint256,uint32)
          handler: handleRevoked
      file: ./src/mandate-registry.ts
